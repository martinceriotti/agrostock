<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#15803d"/>

  <!-- Stem -->
  <line x1="50" y1="70" x2="50" y2="8" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Tip grain (apex) -->
  <path d="M50 5 C44 8 43 16 50 19 C57 16 56 8 50 5Z" fill="white"/>

  <!-- Awns from tip -->
  <line x1="50" y1="6" x2="44" y2="2" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="50" y1="6" x2="56" y2="2" stroke="white" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Grain pair 1 -->
  <path d="M50 23 C46 20 38 22 37 27 C40 30 48 28 50 26Z" fill="white"/>
  <path d="M50 23 C54 20 62 22 63 27 C60 30 52 28 50 26Z" fill="white"/>
  <!-- Awns pair 1 -->
  <line x1="37" y1="24" x2="32" y2="20" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <line x1="63" y1="24" x2="68" y2="20" stroke="white" stroke-width="1" stroke-linecap="round"/>

  <!-- Grain pair 2 -->
  <path d="M50 37 C46 34 37 36 36 41 C39 44 48 43 50 40Z" fill="white"/>
  <path d="M50 37 C54 34 63 36 64 41 C61 44 52 43 50 40Z" fill="white"/>
  <!-- Awns pair 2 -->
  <line x1="36" y1="38" x2="30" y2="34" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <line x1="64" y1="38" x2="70" y2="34" stroke="white" stroke-width="1" stroke-linecap="round"/>

  <!-- Grain pair 3 -->
  <path d="M50 51 C46 48 37 50 36 55 C39 58 48 57 50 54Z" fill="white"/>
  <path d="M50 51 C54 48 63 50 64 55 C61 58 52 57 50 54Z" fill="white"/>
  <!-- Awns pair 3 -->
  <line x1="36" y1="52" x2="30" y2="48" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <line x1="64" y1="52" x2="70" y2="48" stroke="white" stroke-width="1" stroke-linecap="round"/>

  <!-- "AS+" label -->
  <text x="50" y="91"
        font-family="Arial Black, Arial, sans-serif"
        font-size="21"
        font-weight="900"
        fill="white"
        text-anchor="middle"
        letter-spacing="1">AS+</text>
</svg>
